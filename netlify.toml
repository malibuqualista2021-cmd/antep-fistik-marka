# Site ayarı / katalog / sipariş / talepler → Netlify Blobs (`inal-shop-runtime-v1`). Yerelde `data/*.json`.
# RUNTIME_JSON_FORCE_FS=1 ile Netlify’da bile dosya moduna zorlanabilir (önerilmez).
# Next.js: publish dizinini eklentiye bırakın. Git bağlıysa push yeterlidir.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"
